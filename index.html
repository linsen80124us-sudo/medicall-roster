<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Roster Test</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #1e3a8a; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1e40af; }
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.show { display: block; }
        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #dc2626;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🏥 Medical Roster</h1>
        <p>Sign in to access the duty roster system</p>
        
        <div class="alert alert-error" id="errorMsg"></div>
        
        <input type="text" id="username" placeholder="Username (try: linsen)">
        <input type="password" id="password" placeholder="Password (try: admin123)">
        
        <button onclick="testLogin()">Sign In</button>
        
        <p style="margin-top: 20px; font-size: 12px;">
            If you see this page, GitHub Pages is working!<br>
            Next: Add Firebase integration for multi-user access.
        </p>
    </div>

    <script>
        function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            
            if (username === 'linsen' && password === 'admin123') {
                alert('Login successful! (This is a test - Firebase not connected yet)');
                errorDiv.classList.remove('show');
            } else {
                errorDiv.textContent = 'Invalid credentials. Try linsen / admin123';
                errorDiv.classList.add('show');
            }
        }
    </script>
</body>
</html>
